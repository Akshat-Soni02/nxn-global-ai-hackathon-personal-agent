<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1140" width="1800" height="1140" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a44"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/>
    </marker>
    <style>
      .title { font-size: 30px; font-weight: 700; fill: #1c1c22; }
      .sub { font-size: 16px; fill: #55555f; }
      .zone { font-size: 20px; font-weight: 700; }
      .zonesub { font-size: 13px; fill: #55555f; }
      .boxtitle { font-size: 17px; font-weight: 700; fill: #1c1c22; }
      .line { font-size: 13.5px; fill: #33333b; }
      .small { font-size: 12.5px; fill: #55555f; }
      .edge { font-size: 12.5px; fill: #3a3a44; }
      .edgeBlue { font-size: 13px; fill: #1f5fbf; font-weight: 600; }
      .box { fill: #ffffff; stroke: #2b2b33; stroke-width: 1.6; }
      .boxNew { fill: #ffffff; stroke: #1f5fbf; stroke-width: 2.2; }
      .boxExt { fill: #ffffff; stroke: #6b6b75; stroke-width: 1.6; stroke-dasharray: 6 4; }
      .store { fill: #f7f7fa; stroke: #2b2b33; stroke-width: 1.4; }
      .storeNew { fill: #f2f6fd; stroke: #1f5fbf; stroke-width: 1.8; }
    </style>
  </defs>

  <rect width="1800" height="1140" fill="#fbfbf8"/>

  <!-- Title -->
  <text x="40" y="52" class="title">Shadow, managed: what runs where</text>
  <text x="40" y="80" class="sub">25 Oct 2026 · Your work stays on your Mac. Model calls and connected-app calls go through Shadow's own service on Google Cloud. Details: docs/cloud-architecture.md</text>

  <!-- ===================== ZONE: YOUR MAC (30–720) ===================== -->
  <rect x="30" y="110" width="690" height="800" rx="18" fill="#f1f4ec" stroke="#8aa36b" stroke-width="2"/>
  <text x="56" y="146" class="zone" fill="#4f6b2c">Your Mac</text>
  <text x="56" y="168" class="zonesub">Recording, screenshots, voice, masking, workflows, runs, memory, replay. All local, as before.</text>

  <!-- Shadow.app -->
  <rect x="56" y="190" width="300" height="214" rx="12" class="box"/>
  <text x="72" y="218" class="boxtitle">Shadow.app (Swift)</text>
  <text x="72" y="244" class="line">• menu bar ◐, Record pill, notifications</text>
  <text x="72" y="266" class="line">• window (the daemon's pages)</text>
  <text x="72" y="288" class="line">• Mac apps: record + replay</text>
  <text x="86" y="306" class="line">(Accessibility)</text>
  <text x="72" y="328" class="line">• on the Mac: screenshot words read</text>
  <text x="86" y="346" class="line">and masked; voice → text</text>
  <text x="72" y="370" class="line">• first run: <tspan font-weight="700" fill="#1f5fbf">Sign in</tspan> (no API key)</text>
  <text x="72" y="392" class="line">• Settings: <tspan font-weight="700" fill="#1f5fbf">Connected apps</tspan>, usage</text>

  <!-- Daemon -->
  <rect x="396" y="190" width="300" height="340" rx="12" class="box"/>
  <text x="412" y="218" class="boxtitle">Daemon (Node, in the app)</text>
  <text x="412" y="244" class="line">• workflows + versions, runs, triggers</text>
  <text x="412" y="266" class="line">• inbox: approvals, questions</text>
  <text x="412" y="288" class="line">• recordings/ (events, shots, voice)</text>
  <text x="412" y="310" class="line">• memory (SQLite), shadow.db</text>
  <text x="412" y="332" class="line">• design + repair agents: the loop</text>
  <text x="426" y="350" class="line">runs here (reads recordings, drives</text>
  <text x="426" y="368" class="line">your Chrome for test runs, repair)</text>
  <text x="412" y="392" class="line" fill="#1f5fbf">• <tspan font-weight="700">MCP client</tspan>: runs "mcp" steps</text>
  <text x="412" y="414" class="line" fill="#1f5fbf">• <tspan font-weight="700">account</tspan>: device token, refresh</text>
  <text x="412" y="436" class="line">• local API: Unix socket + 127.0.0.1</text>
  <text x="412" y="470" class="small">dev only: NEBIUS_API_KEY in .env →</text>
  <text x="412" y="488" class="small">calls Nebius directly, no service,</text>
  <text x="412" y="506" class="small">no caps</text>

  <!-- Chrome extension -->
  <rect x="56" y="444" width="300" height="118" rx="12" class="box"/>
  <text x="72" y="472" class="boxtitle">Chrome extension</text>
  <text x="72" y="498" class="line">• records web pages (events,</text>
  <text x="86" y="516" class="line">screenshots)</text>
  <text x="72" y="540" class="line">• replays in your Chrome (CDP)</text>

  <!-- native host -->
  <rect x="56" y="604" width="300" height="72" rx="12" class="box"/>
  <text x="72" y="632" class="boxtitle">native-host shim</text>
  <text x="72" y="656" class="line">Chrome starts it; it forwards bytes</text>

  <!-- Keychain -->
  <rect x="396" y="574" width="300" height="102" rx="12" class="store"/>
  <text x="412" y="602" class="boxtitle">Keychain</text>
  <text x="412" y="626" class="line" fill="#1f5fbf">the device's refresh token</text>
  <text x="412" y="646" class="small">(was: the Nebius key)</text>
  <text x="412" y="664" class="small">no API key is ever on the Mac</text>

  <!-- Local edges -->
  <line x1="356" y1="296" x2="396" y2="296" stroke="#3a3a44" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="376" y="284" class="edge" text-anchor="middle">socket</text>
  <line x1="206" y1="562" x2="206" y2="604" stroke="#3a3a44" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="214" y="588" class="edge">native messaging</text>
  <path d="M356,640 C378,640 378,500 396,500" fill="none" stroke="#3a3a44" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="300" y="590" class="edge" text-anchor="end"></text>
  <line x1="546" y1="530" x2="546" y2="574" stroke="#3a3a44" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Browser -->
  <rect x="56" y="720" width="640" height="166" rx="12" class="box"/>
  <text x="72" y="748" class="boxtitle">Your browser: only for two moments</text>
  <text x="72" y="776" class="line">1. <tspan font-weight="700">Sign in</tspan> (first run): the app shows a code; the browser opens</text>
  <text x="90" y="796" class="line">Shadow's sign-in page (Google or email). The app gets its device token.</text>
  <text x="72" y="824" class="line">2. <tspan font-weight="700">Connect an app</tspan> (Settings → Connected apps): Composio's</text>
  <text x="90" y="844" class="line">sign-in page for Google Sheets, Gmail, Slack… Composio keeps the tokens.</text>
  <text x="72" y="872" class="small">Nothing else happens in the browser; the work itself runs in the daemon.</text>

  <!-- ===================== ZONE: GOOGLE CLOUD (840–1330) ===================== -->
  <rect x="840" y="110" width="490" height="800" rx="18" fill="#eef3fb" stroke="#1f5fbf" stroke-width="2"/>
  <text x="864" y="146" class="zone" fill="#1f5fbf">Google Cloud (Shadow's project)</text>
  <text x="864" y="168" class="zonesub">New. One stateless service; holds the keys, accounts, quotas.</text>

  <!-- shadow-api -->
  <rect x="864" y="190" width="442" height="310" rx="12" class="boxNew"/>
  <text x="880" y="218" class="boxtitle">shadow-api · Cloud Run (TypeScript)</text>
  <text x="880" y="246" class="line"><tspan font-weight="700">/v1/auth/device</tspan> · the app signs in (code → token)</text>
  <text x="880" y="272" class="line"><tspan font-weight="700">/v1/llm/chat/completions</tspan> · OpenAI-compatible</text>
  <text x="896" y="292" class="line">relay: quota, profile → model, adds the key, meters</text>
  <text x="880" y="318" class="line"><tspan font-weight="700">/v1/tools/mcp</tspan> · one MCP server per user: the</text>
  <text x="896" y="338" class="line">tools of the apps they connected, run as them</text>
  <text x="880" y="364" class="line"><tspan font-weight="700">/v1/tools/connect</tspan> · start connecting an app</text>
  <text x="880" y="390" class="line"><tspan font-weight="700">/v1/usage</tspan> · today and this month vs the free tier</text>
  <text x="880" y="422" class="small">Quotas enforced here, before every call (reserve, settle).</text>
  <text x="880" y="442" class="small">Prompts and tool arguments are never logged.</text>
  <text x="880" y="462" class="small">Scales to zero; min 1 instance during the demo.</text>
  <text x="880" y="486" class="small" fill="#1f5fbf">Uses everything below.</text>

  <!-- Stores -->
  <rect x="864" y="526" width="210" height="116" rx="12" class="storeNew"/>
  <text x="880" y="554" class="boxtitle">Firestore</text>
  <text x="880" y="578" class="line">users, devices</text>
  <text x="880" y="598" class="line">connected apps</text>
  <text x="880" y="618" class="line">quotas, usage ledger</text>

  <rect x="1096" y="526" width="210" height="116" rx="12" class="storeNew"/>
  <text x="1112" y="554" class="boxtitle">Secret Manager</text>
  <text x="1112" y="578" class="line">Nebius key</text>
  <text x="1112" y="598" class="line">Composio key</text>
  <text x="1112" y="618" class="line">token-signing key</text>

  <rect x="864" y="660" width="210" height="100" rx="12" class="storeNew"/>
  <text x="880" y="688" class="boxtitle">Identity Platform</text>
  <text x="880" y="712" class="line">Sign in with Google</text>
  <text x="880" y="732" class="line">or email → user id</text>

  <rect x="1096" y="660" width="210" height="100" rx="12" class="storeNew"/>
  <text x="1112" y="688" class="boxtitle">Logging, Monitoring</text>
  <text x="1112" y="712" class="line">metadata only</text>
  <text x="1112" y="732" class="line">budget alert</text>

  <text x="864" y="796" class="small">Built from the monorepo: apps/api → Cloud Build →</text>
  <text x="864" y="814" class="small">Artifact Registry → Cloud Run.</text>
  <text x="864" y="842" class="small">Could move to Nebius AI Cloud later (VMs, managed</text>
  <text x="864" y="860" class="small">Kubernetes): the same container.</text>

  <!-- ===================== ZONE: OUTSIDE (1430–1770) ===================== -->
  <rect x="1430" y="110" width="340" height="800" rx="18" fill="#f6f2fa" stroke="#7d5ba6" stroke-width="2"/>
  <text x="1454" y="146" class="zone" fill="#6a4596">Outside services</text>
  <text x="1454" y="168" class="zonesub">Reached only by shadow-api, with Shadow's keys.</text>

  <rect x="1454" y="190" width="292" height="196" rx="12" class="boxExt"/>
  <text x="1470" y="218" class="boxtitle">Nebius Token Factory</text>
  <text x="1470" y="244" class="line">fast: Nemotron 3.5 Lightning</text>
  <text x="1470" y="266" class="line">smart: Nemotron 3 Super</text>
  <text x="1470" y="288" class="line">vision: GLM-5.3-Flash</text>
  <text x="1470" y="318" class="line"><tspan font-weight="700">Zero Data Retention</tspan> on</text>
  <text x="1470" y="338" class="line">Shadow's organisation: prompts</text>
  <text x="1470" y="358" class="line">not stored or used for training</text>

  <rect x="1454" y="420" width="292" height="176" rx="12" class="boxExt"/>
  <text x="1470" y="448" class="boxtitle">Composio</text>
  <text x="1470" y="474" class="line">each user = one entity</text>
  <text x="1470" y="496" class="line">their connected accounts: OAuth</text>
  <text x="1470" y="516" class="line">sign-in, tokens, refresh</text>
  <text x="1470" y="538" class="line">runs a tool (GOOGLESHEETS_…)</text>
  <text x="1470" y="572" class="small">managed auth apps for now; free tier</text>

  <rect x="1454" y="636" width="292" height="110" rx="12" class="boxExt"/>
  <text x="1470" y="664" class="boxtitle">The apps' own APIs</text>
  <text x="1470" y="690" class="line">Google Sheets, Gmail, Drive,</text>
  <text x="1470" y="710" class="line">Slack, Notion, GitHub…</text>

  <line x1="1600" y1="596" x2="1600" y2="636" stroke="#3a3a44" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ===================== CROSS-ZONE EDGES ===================== -->
  <!-- daemon -> shadow-api (gap 720–840) -->
  <line x1="696" y1="320" x2="864" y2="320" stroke="#1f5fbf" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="732" y="282" class="edgeBlue">HTTPS</text>
  <text x="732" y="300" class="edgeBlue">+ device token</text>
  <text x="732" y="344" class="edge">model calls,</text>
  <text x="732" y="362" class="edge">tool calls</text>

  <!-- shadow-api -> nebius (gap 1330–1430) -->
  <line x1="1306" y1="280" x2="1454" y2="280" stroke="#1f5fbf" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
  <text x="1342" y="268" class="edge">Shadow's key</text>
  <!-- shadow-api -> composio -->
  <path d="M1306,360 C1370,360 1380,470 1454,470" fill="none" stroke="#1f5fbf" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
  <text x="1318" y="332" class="edge">Shadow's key,</text>
  <text x="1318" y="350" class="edge">user = entity</text>

  <!-- browser -> identity (dotted) -->
  <path d="M696,780 C780,780 790,712 864,712" fill="none" stroke="#6b6b75" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="732" y="738" class="edge">sign in</text>
  <!-- browser -> composio (dotted) -->
  <path d="M696,848 C960,950 1390,950 1470,596" fill="none" stroke="#6b6b75" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="1000" y="938" class="edge">connect an app (Composio's sign-in page)</text>

  <!-- ===================== BOTTOM ===================== -->
  <rect x="30" y="964" width="1740" height="156" rx="14" fill="#ffffff" stroke="#c9c9d1" stroke-width="1.4"/>
  <text x="56" y="996" class="boxtitle">Stays on the Mac</text>
  <text x="56" y="1022" class="line">recordings (events, screenshots, voice), workflows and versions, runs, memory, the inbox, logs,</text>
  <text x="56" y="1042" class="line">pictures and audio (unless Pictures is on: then one masked picture per agent request)</text>
  <text x="56" y="1070" class="small">Raw recordings are deleted 24 h after the workflow is saved.</text>

  <text x="920" y="996" class="boxtitle" fill="#1f5fbf">Leaves the Mac (through shadow-api)</text>
  <text x="920" y="1022" class="line">→ Nebius: masked screen words, narration text, workflow steps, an AI step's input</text>
  <text x="920" y="1042" class="line">→ Composio: a tool's arguments and result (the row appended, the email read)</text>
  <text x="920" y="1070" class="small">shadow-api counts every call against the user's free tier (Firestore). Editing the app can't change it:</text>
  <text x="920" y="1088" class="small">the Mac holds only a device token, never a key. Developers: NEBIUS_API_KEY in .env skips the service.</text>
</svg>
