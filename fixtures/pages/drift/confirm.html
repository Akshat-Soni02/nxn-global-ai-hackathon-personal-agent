<!doctype html>
<meta charset="utf-8" />
<title>Invoice portal</title>
<!-- Drift: submitting now opens a confirmation dialog, and the invoice is only sent after "Confirm". Expected: insert
     a click on "Confirm" right after the (approved) submit step, needing approval itself; anything else escalates. -->
<main>
  <h1>Invoices</h1>
  <form id="upload-form" onsubmit="return false">
    <label>Invoice number <input name="number" /></label>
    <label>Invoice PDF <input type="file" name="invoice" accept="application/pdf" /></label>
    <button type="button" id="submit">Submit</button>
  </form>
  <dialog id="sure" aria-label="Send this invoice?">
    <h2>Send this invoice?</h2>
    <button type="button" id="confirm">Confirm</button>
    <button type="button" onclick="this.closest('dialog').close()">Back</button>
  </dialog>
  <p id="status" role="status"></p>
</main>
<script>
  document.getElementById("submit").addEventListener("click", () => document.getElementById("sure").showModal());
  document.getElementById("confirm").addEventListener("click", () => {
    document.getElementById("sure").close();
    document.getElementById("status").textContent = "Invoice submitted";
  });
</script>
