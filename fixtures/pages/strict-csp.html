<!doctype html>
<meta charset="utf-8" />
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self'; style-src 'self'; require-trusted-types-for 'script'"
/>
<title>Strict page</title>
<h1>Strict page</h1>
<p>
  A strict Content-Security-Policy with Trusted Types, as Google Sheets and YouTube send. No inline styles, no
  innerHTML: the Task Player button must still draw here, styled.
</p>
