<!doctype html>
<meta charset="utf-8" />
<title>Dialogs</title>
<!-- A page that raises the three JavaScript dialogs, to check how a run answers them. Each button writes what the page
     got back into #result: alert -> "alert closed", confirm -> "confirm: true|false", prompt -> "prompt: <text>|null". -->
<h1>Dialogs</h1>
<button type="button" id="alert">Show notice</button>
<button type="button" id="confirm">Delete items</button>
<button type="button" id="prompt">Copy items</button>
<p id="result">nothing yet</p>
<script>
  const out = (text) => {
    document.getElementById("result").textContent = text;
  };
  document.getElementById("alert").addEventListener("click", () => {
    alert("Saved.");
    out("alert closed");
  });
  document.getElementById("confirm").addEventListener("click", () => {
    out(`confirm: ${confirm("Delete 3 items?")}`);
  });
  document.getElementById("prompt").addEventListener("click", () => {
    out(`prompt: ${prompt("Name for the copy?", "copy")}`);
  });
</script>
