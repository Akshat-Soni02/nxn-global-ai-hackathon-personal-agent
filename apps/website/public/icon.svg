<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Shadow</title>
  <style>
    .rim { stroke: #7f86b8; stroke-opacity: 0.6; }
    @media (prefers-color-scheme: dark) { .rim { stroke-opacity: 0.8; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242642"/>
      <stop offset="1" stop-color="#0d0d17"/>
    </linearGradient>
    <filter id="s" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="64" height="64" rx="14.3" fill="url(#g)"/>
  <circle cx="36" cy="36" r="12" fill="#3a5bd9" opacity="0.9" filter="url(#s)"/>
  <circle cx="30" cy="30" r="12" fill="#fafaff"/>
  <circle cx="30" cy="30" r="4.1" fill="#ef4444"/>
  <!-- A 1 px rim at any size (non-scaling): on a dark tab strip the night square alone is ~1.2:1 against the tab. -->
  <rect class="rim" x="1.5" y="1.5" width="61" height="61" rx="12.8" fill="none" stroke-width="1" vector-effect="non-scaling-stroke"/>
</svg>
